# Cloudflare Worker that lets the static GitHub Pages site use Claude without exposing the API key.
# Deploy:  cd worker && npx wrangler deploy
# Secret:  npx wrangler secret put ANTHROPIC_API_KEY      (paste the key when asked; never commit it)

name = "dhanshiri-plant-doctor"
main = "plant-doctor-worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# Website origins allowed to call the Worker: scheme + host only, no path, comma-separated.
ALLOWED_ORIGINS = "https://www.dhanshirigarden.com,https://dhanshirigarden.com,https://abidabdullahh.github.io,http://localhost:5173"

# Optional: any Claude model that accepts images.
MODEL = "claude-sonnet-5-5"
