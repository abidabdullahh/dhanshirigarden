    <noscript>
      <div style="font-family: sans-serif; padding: 2rem; max-width: 900px; margin: 0 auto; line-height: 1.6;">
        <h1>ধানসিঁড়ি গার্ডেন | ল্যান্ডস্কেপ ডিজাইন, ছাদবাগান ও কার্পেট ঘাসের লন (Dhaka & Naogaon)</h1>
        <p>ধানসিঁড়ি গার্ডেন (Dhanshiri Garden) ঢাকা ও নওগাঁ জুড়ে আধুনিক ল্যান্ডস্কেপ ডিজাইন, ছাদবাগান নির্মাণ, বারমুডা ও জাপানিজ কার্পেট ঘাসের লন তৈরি, বায়োফিলিক ভার্টিক্যাল গার্ডেন ও নিয়মিত বাগান পরিচর্যা প্রদান করে। প্রতিষ্ঠাতা ও প্রধান কৃষি পরামর্শক: জনাব আমির আলী (Mr. Amir Ali)।</p>
        
        <h2>আমাদের প্রধান সেবাসমূহ:</h2>
        <ul>
          <li><strong>ছাদবাগান ডিজাইন ও নির্মাণ (Rooftop Garden):</strong> আধুনিক ৩-স্তরের ড্রেইনেজ ফিল্টার, হালকা পুষ্টিকর মাটি ও ছাদের ওয়াটারপ্রুফিং।</li>
          <li><strong>ল্যান্ডস্কেপ ডিজাইন (Landscape Design):</strong> বাণিজ্যিক রিসোর্ট, ফ্যাক্টরি, ফার্মহাউস ও আবাসিক উদ্যান পরিকল্পনা।</li>
          <li><strong>কার্পেট ঘাস ও লন রোলিং (Bermuda Carpet Grass Lawn):</strong> প্রিমিয়াম বারমুডা ঘাস স্থাপন, রোলার লেভেলিং ও আগাছা দমন।</li>
          <li><strong>ভার্টিক্যাল গার্ডেন (Vertical Living Green Wall):</strong> স্বয়ংক্রিয় ড্রিপ সেচযুক্ত ইনডোর ও আউটডোর জীবন্ত সবুজ দেয়াল।</li>
          <li><strong>নিয়মিত বাগান পরিচর্যা (Garden Care Plans):</strong> অভিজ্ঞ মালি ও কৃষিবিদদের তত্ত্বাবধানে সাপ্তাহিক ও মাসিক কেয়ার।</li>
          <li><strong>এআই উদ্ভিদ ডাক্তার (AI Plant Doctor):</strong> গাছের পাতার ছবি দিয়ে তাৎক্ষণিক রোগবালাই নির্ণয় ও সমাধান।</li>
        </ul>
